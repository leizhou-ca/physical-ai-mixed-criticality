<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="400" fill="#ffffff"/>
<text x="40" y="30" font-size="17" font-weight="600" fill="#111">One cell, two instruments, and a candidate that does not survive</text>
<text x="40" y="48" font-size="12" fill="#555">Intertask messaging latency under an I/O aggressor. The tail moves. The question is what moved it.</text>
<text x="40" y="86" font-size="13" font-weight="600" fill="#111">Hardware counters — does a channel explain it?</text>
<rect x="40" y="104" width="330" height="26" fill="#f4f6f5" stroke="#e2e6e4"/>
<text x="50" y="121" font-size="12" fill="#333">L1D refill</text>
<text x="236" y="121" font-size="12" font-weight="600" fill="#2f6f4f" text-anchor="end">1.1×</text>
<text x="248" y="121" font-size="11" fill="#777">nominal</text>
<rect x="40" y="134" width="330" height="26" fill="#f4f6f5" stroke="#e2e6e4"/>
<text x="50" y="151" font-size="12" fill="#333">L2D refill</text>
<text x="236" y="151" font-size="12" font-weight="600" fill="#8a8f98" text-anchor="end">no signal</text>
<text x="248" y="151" font-size="11" fill="#777">zero denominator</text>
<rect x="40" y="164" width="330" height="26" fill="#f4f6f5" stroke="#e2e6e4"/>
<text x="50" y="181" font-size="12" fill="#333">branch mispredict</text>
<text x="236" y="181" font-size="12" font-weight="600" fill="#2f6f4f" text-anchor="end">1.2×</text>
<text x="248" y="181" font-size="11" fill="#777">nominal</text>
<rect x="40" y="194" width="330" height="26" fill="#f4f6f5" stroke="#e2e6e4"/>
<text x="50" y="211" font-size="12" fill="#333">TLB refill</text>
<text x="236" y="211" font-size="12" font-weight="600" fill="#2f6f4f" text-anchor="end">1.0×</text>
<text x="248" y="211" font-size="11" fill="#777">nominal</text>
<rect x="40" y="224" width="330" height="26" fill="#f4f6f5" stroke="#e2e6e4"/>
<text x="50" y="241" font-size="12" fill="#333">CPU cycles</text>
<text x="236" y="241" font-size="12" font-weight="600" fill="#2f6f4f" text-anchor="end">1.1×</text>
<text x="248" y="241" font-size="11" fill="#777">nominal</text>
<rect x="40" y="254" width="330" height="26" fill="#f4f6f5" stroke="#e2e6e4"/>
<text x="50" y="271" font-size="12" fill="#333">utilisation</text>
<text x="236" y="271" font-size="12" font-weight="600" fill="#2f6f4f" text-anchor="end">flat</text>
<text x="248" y="271" font-size="11" fill="#777">on-CPU, not displaced</text>
<text x="40" y="300" font-size="12" fill="#2f6f4f" font-weight="600">Verdict from this tier: not a hardware channel.</text>
<text x="410" y="86" font-size="13" font-weight="600" fill="#111">Kernel events — which software path?</text>
<rect x="410" y="124" width="220" height="18" fill="#eceeed" stroke="#e2e6e4"/>
<rect x="410" y="124" width="155.1" height="18" fill="#c25b2a"/>
<text x="410" y="118" font-size="12" fill="#333">interrupt handler, in outlier intervals</text>
<text x="638" y="138" font-size="12" font-weight="600" fill="#c25b2a">.705</text>
<rect x="410" y="178" width="220" height="18" fill="#eceeed" stroke="#e2e6e4"/>
<rect x="410" y="178" width="0.0" height="18" fill="#2f6f4f"/>
<text x="410" y="172" font-size="12" fill="#333">interrupt handler, in nominal intervals</text>
<text x="638" y="192" font-size="12" font-weight="600" fill="#2f6f4f">0</text>
<text x="410" y="222" font-size="12" fill="#333">events falling in no interval: reported</text>
<text x="410" y="244" font-size="12" fill="#333">enrichment ratio: <tspan font-weight="600" fill="#8a8f98">withheld</tspan></text>
<text x="410" y="262" font-size="11" fill="#777">nominal count is zero — a ratio here would be</text>
<text x="410" y="277" font-size="11" fill="#777">infinite, and infinity is not a large effect.</text>
<text x="410" y="303" font-size="12" fill="#c25b2a" font-weight="600">Candidate named. Then differenced — see below.</text>
<rect x="40" y="336" width="680" height="46" fill="#fbf7f2" stroke="#e8ddcf"/>
<text x="52" y="356" font-size="12" fill="#5a4630">With the aggressor OFF the same event covers 0.709 of outliers. The candidate does not survive the</text>
<text x="52" y="373" font-size="12" fill="#5a4630">differential: it is a property of the metric, not the aggressor's doing. Verdict: none.</text>
</svg>